name: Keep Render Server Alive (24/7)

on:
  schedule:
    # 10분마다 실행하여 Render 무료 인스턴스가 잠들지 않도록 방지
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Render Health Check
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://two027-hrd-needs-survey.onrender.com/health
